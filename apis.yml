aid: modcloth
name: Modcloth
description: >-
  Modcloth is a vintage-inspired, indie and retro women's fashion retailer selling
  dresses, apparel, footwear, and accessories through its Shopify-hosted online store
  at modcloth.com. Surfaced as a portfolio company of Norwest Venture Partners, the
  store exposes a real agent-facing commerce surface: a Universal Commerce Protocol
  (UCP) shopping service over an MCP endpoint, Shopify customer-account OAuth 2.0 /
  OpenID Connect, published /llms.txt and /agents.md agent instructions, and read-only
  Shopify Storefront JSON for catalog and collections. Checkout requires contemporaneous
  buyer approval.
